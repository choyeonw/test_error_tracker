<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오답 등록</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>오답 등록</h1>
    <a href="index.html">목록으로 돌아가기</a>
  </header>

  <main>
    <form>
      <label>과목 <input type="text" name="subject" required></label>
      <label>단원 <input type="text" name="unit" required></label>
      <label>세부 개념 <input type="text" name="concept" required></label>
      <label>오답 유형 <input type="text" name="mistakeType" required></label>
      <label>난이도 <input type="text" name="difficulty" required></label>
      <label>틀린 이유 <textarea name="reason" required></textarea></label>
      <label>문제집 이름 <input type="text" name="book"></label>
      <label>페이지 <input type="text" name="page"></label>
      <label>문제 번호 <input type="text" name="questionNumber"></label>
      <label>시험명 <input type="text" name="exam"></label>
      <label>추가 메모 <textarea name="memo"></textarea></label>

      <button type="submit">오답 등록</button>
    </form>
  </main>
<script src="js/app.js"></script>
</body>
</body>
</html>
