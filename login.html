<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>로그인 · 회원가입</h1>
    <a href="index.html">메인으로 돌아가기</a>
  </header>

  <main>
    <form id="auth-form">
      <label>이메일 <input id="email" type="email" required></label>
      <label>비밀번호 <input id="password" type="password" minlength="8" required></label>
      <div>
        <button type="submit">로그인</button>
        <button type="button" id="signup">회원가입</button>
      </div>
    </form>
    <p id="message"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const client = window.supabase.createClient(
      "https://qponjiyejfxifdjwufdh.supabase.co",
      "sb_publishable_hxJuW49Zug74tXyoGcEYzQ_LkkR__0L"
    );

    const form = document.getElementById("auth-form");
    const message = document.getElementById("message");

    function credentials() {
      return {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      };
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      const { error } = await client.auth.signInWithPassword(credentials());

      if (error) {
        message.textContent = "로그인 실패: " + error.message;
      } else {
        message.textContent = "로그인 성공!";
        window.location.href = "index.html";
      }
    });

    document.getElementById("signup").addEventListener("click", async function () {
      if (!form.reportValidity()) return;

      const { data, error } = await client.auth.signUp(credentials());

      if (error) {
        message.textContent = "회원가입 실패: " + error.message;
      } else if (data.session) {
        message.textContent = "회원가입과 로그인에 성공했습니다.";
      } else {
        message.textContent = "가입 확인 이메일을 열어 인증한 뒤 로그인하세요.";
      }
    });
  </script>
</body>
</html>
